name: imgzen-website

services:
  imgzen-website:
    # Built by GitHub Actions (.github/workflows/deploy.yml); TAG is the commit SHA of the deploy.
    image: ghcr.io/linkandreas/imgzen-website:${TAG:-latest}
    container_name: imgzen-website
    # No published ports: the cloudflared container on the `web` network reaches it at
    # http://imgzen-website:32773 and serves it (with HTTPS) at the domain.
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    external: true
